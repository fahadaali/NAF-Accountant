<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ناف القانونية — المحاسب الذكي</title>
    <!-- الخط من عنصر naf-font في السجلّ — مستضاف ذاتياً عبر @fontsource،
         بلا طلبات لخوادم خارجية. حلّ محلّ تحميل Cairo/Tajawal من Google Fonts. -->
    <!-- المظهر قبل الرسم الأول: بدونه تومض الصفحة فاتحة ثم تسودّ.
         المنطق كاملاً في src/lib/theme.js — هذا سطر التطبيق الأولي وحده. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('naf_theme');
          var dark =
            m === 'dark' ||
            (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-CLJBVmy4.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CCHeii89.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
