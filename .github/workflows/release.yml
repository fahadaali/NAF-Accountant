name: الإصدار

# يعمل عند الدمج في main فقط.
# CHANGELOG.md مستثنى: التزام السجلّ الذي ينتجه هذا السير لا يعيد تشغيله.
on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md

# إصدار واحد في كل مرة. دمجان متتاليان لا ينتجان وسمين متسابقين.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: سحب المستودع بتاريخه كاملاً
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تركيب الحزم
        run: npm install --no-audit --no-fund

      # ------------------------------------------------------------------
      # [مُكيَّف للمنصة] أُسقطت خطوتا «التحقق من صحة السجلّ» و«إعادة بناء
      # ملفات السجلّ» من نسخة naf-governance الأصلية: كلتاهما تفترضان
      # registry.json و public/ r، وهما خاصّان بمستودع naf-ui نفسه ولا
      # وجود لهما في منصة مستهلِكة — فتُفشلان كل دمج في main.
      # بديلهما هنا بوابة بناء المنصة.
      # ⚠️ يُفضَّل تسجيل «نسخة منصة» من naf-governance في السجلّ.
      # ------------------------------------------------------------------
      - name: بوابة الجودة — لا يصدر إصدار من بناء معطوب أو اختبار ساقط
        run: |
          npm test
          npm --prefix frontend install --no-audit --no-fund
          npm --prefix frontend run lint
          npm --prefix frontend run build

      - name: استنتاج رقم الإصدار وتوليد سجلّ التغييرات
        id: decide
        run: node .github/scripts/release.mjs >> "$GITHUB_OUTPUT"

      - name: لا يوجد ما يستحق إصداراً
        if: steps.decide.outputs.release != 'true'
        run: echo "لا التزام يستحق إصداراً منذ آخر وسم. لا شيء يُنشر."

      - name: التزام سجلّ التغييرات
        if: steps.decide.outputs.release == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): ${{ steps.decide.outputs.tag }}"
          git push origin HEAD:main

      - name: إنشاء الوسم ودفعه
        if: steps.decide.outputs.release == 'true'
        run: |
          git tag -a "${{ steps.decide.outputs.tag }}" -m "${{ steps.decide.outputs.tag }}"
          git push origin "${{ steps.decide.outputs.tag }}"

      - name: نشر الإصدار على GitHub
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.decide.outputs.tag }}" \
            --title "${{ steps.decide.outputs.tag }}" \
            --notes-file release-notes.md
