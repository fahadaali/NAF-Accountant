# ============================================================================
# NAF Accountant - Cloudflare Worker Configuration
# منصة "ناف لو" المحاسبية الذكية - إعدادات Cloudflare Worker
# ============================================================================

name = "naf-accountant"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ----------------------------------------------------------------------------
# ملفات لوحة التحكم الثابتة (Static Assets) — يخدمها نفس الـ Worker.
# يُبنى مجلد frontend/dist عبر أمر البناء في Workers Builds:
#   cd frontend && npm install && npm run build
# ثم يخدمها الـ Worker على نفس الرابط (اللوحة + الـ API معاً).
# ----------------------------------------------------------------------------
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# طبقة الأصول تخدم الملف المطابق قبل تشغيل الـ Worker افتراضياً، فيصل الزائر
# إلى index.html على الجذر دون أن يمرّ بوسيط الدخول الموحّد إطلاقاً.
# هذا يجعل الـ Worker يعمل أولاً دائماً، فتُطبَّق الحماية على كل مسار،
# والأصول الساكنة تُخدم بعده من قائمة المسارات العامة (بادئة /assets/).
run_worker_first = true

# ----------------------------------------------------------------------------
# Cloudflare D1 Database (قاعدة البيانات)
# أنشئ القاعدة أولاً:  wrangler d1 create naf-accountant-db
# ثم انسخ الـ database_id هنا.
# ----------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "naf-accountant-db"
database_id = "16fc771e-e3d6-4140-a651-1d7a3c215806"

# ----------------------------------------------------------------------------
# Cloudflare R2 Storage (تخزين الملفات: الصوتيات والفواتير)
# أنشئ الحاوية أولاً:  wrangler r2 bucket create naf-accountant-media
# ----------------------------------------------------------------------------
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "naf-accountant-media"

# ----------------------------------------------------------------------------
# Cloudflare Workers AI (نموذج Whisper لتحويل الصوت إلى نص)
# ----------------------------------------------------------------------------
[ai]
binding = "AI"

# ----------------------------------------------------------------------------
# Cloudflare Images (تحويل صور الفواتير)
# يقرأ محلّل الفواتير صيغ JPEG و PNG و GIF و WebP فقط، بينما كاميرا الآيفون
# تنتج HEIC افتراضياً. هذا الربط يحوّل HEIC و HEIF و AVIF و TIFF و BMP إلى
# JPEG، ويصغّر الصور التي تتجاوز حدّ الحجم بدل رفضها.
# يتطلب تفعيل «Transformations» للحساب من: Images → Transformations.
# ----------------------------------------------------------------------------
[images]
binding = "IMAGES"

# ----------------------------------------------------------------------------
# Cloudflare KV — الدخول الموحّد (naf-auth).
#
# مفتاحان لا ثالث لهما:
#   sess:{sid}     جلسة المنصة — عمرها ما بقي من عمر رمز المركز
#   jwks:{issuer}  كاش مفاتيح التوقيع — خمس دقائق
#
# ولا مفتاح حالة عابرة: `state` يولّده المركز ويخزّنه مع رمز العبور
# ويطابق الاثنين عند المبادلة، وهذه المنصة تعيده كما وصلها.
#
# المعرّف يُلتزَم هنا لا في اللوحة: النشر من Workers Builds يقرأ هذا
# الملف ويجعل ما فيه هو الحقيقة، فربطٌ يُضاف من `Settings ← Bindings`
# يمحوه أوّل نشر. وهو عنوان مساحة لا مفتاح وصول، فلا سرّ فيه.
#
# ولإنشاء واحدة جديدة:  wrangler kv namespace create AUTH_KV
# ----------------------------------------------------------------------------
[[kv_namespaces]]
binding = "AUTH_KV"
id = "55d751613b7b4b67816b21fee1f97771"

# ----------------------------------------------------------------------------
# الدخول الموحّد — متغيّران غير سريّين، وهما وحدهما ما يختلف بين منصة وأخرى.
# يُكتبان هنا لا في اللوحة: لا سرّ فيهما، وقيمتهما جزء من إعداد المنصة
# ويجب أن تُراجَع مع الكود. أمّا AUTH_CLIENT_SECRET فعبر:
#   wrangler secret put AUTH_CLIENT_SECRET
# ولا يُكتب هنا ولا في الكود إطلاقاً.
# ----------------------------------------------------------------------------
[vars]
PLATFORM_ID = "NAF-Accountant"
AUTH_ISSUER = "https://app.naflaw.sa"

# ----------------------------------------------------------------------------
# نطاق المنصة العلني — مرجعُ رابط ويبهوك تليجرام.
#
# ويبهوك تليجرام مسجَّل عند تليجرام لا هنا، فنقلُ المنصة إلى نطاقٍ جديد لا
# ينقله معها: يبقى يسلّم إلى النطاق السابق حتى يُعاد تسجيله يدوياً. والانقطاع
# صامتٌ تماماً — الطلب لا يبلغ المنصة، فلا سطر في سجلّ ولا رسالة للمستخدم.
#
# فيُكتب النطاق هنا ليكون للفحص مرجعٌ يقارن به، وليصحّح الحارس الليلي الرابط
# من نفسه عند اختلافه. وبلا هذه القيمة يُبلَّغ العطل ولا يُصلَح: الرابط لا
# يُخمَّن من نطاق الطلب، وإلا وجّه أيُّ مضيفٍ يبلغ الـWorker البوتَ إليه.
#
# ولا سرّ فيه، وقيمته جزء من إعداد المنصة تُراجَع مع الكود — كـ`AUTH_ISSUER`.
# ولمسارٍ مختلف كلياً: TELEGRAM_WEBHOOK_URL يَجُبّ هذه القيمة.
# ----------------------------------------------------------------------------
PUBLIC_ORIGIN = "https://acc.naflaw.sa"

# ----------------------------------------------------------------------------
# Cron Triggers (المهام المجدولة) — الأوقات بتوقيت UTC:
#   "0 22 * * *" : مزامنة شجرة الحسابات كل ليلة (01:00 السعودية).
#   "0 6 1 * *"  : ملخص المسودات المعلّقة إلى بيسكامب أول كل شهر.
#   "0 7 1 * *"  : التقارير المالية أول كل شهر — والمنطق داخل الكود يحدّد:
#                  شهري دائماً + ربعي أول كل ربع + سنوي أول السنة.
# (دُمجت التقارير في مهمة واحدة لتقليل عدد مهام Cron ضمن حدود الخطة.)
# ----------------------------------------------------------------------------
[triggers]
crons = ["0 22 * * *", "0 6 1 * *", "0 7 1 * *"]

# ============================================================================
# كل المتغيرات والأسرار تُدار من لوحة Cloudflare مباشرة — وليست في هذا الملف.
# ----------------------------------------------------------------------------
# لماذا؟ أي قيمة تُوضع هنا تحت [vars] سيعيد النشر كتابتها فوق ما تعدّله يدوياً
# في اللوحة. لذلك نتركها كلها في:
#   Workers & Pages → naf-accountant → Settings → Variables and secrets
#
# أضِف القيم التالية من اللوحة بنوع "Secret" (يبقى محفوظاً عبر عمليات النشر):
#
#   المفاتيح الحساسة:
#     CLAUDE_API_KEY
#     WAFEQ_API_KEY
#     BASECAMP_TOKEN
#     TELEGRAM_BOT_TOKEN
#     TELEGRAM_WEBHOOK_SECRET      # للتحقق من صحة طلبات الويبهوك
#     AUTHORIZED_CHAT_IDS          # معرّفات المحادثات المصرّح لها (مفصولة بفواصل)
#     DASHBOARD_API_KEY            # مفتاح حماية واجهة لوحة التحكم
#
#   معرّفات بيسكامب (أضِفها بنوع Secret أيضاً كي لا يمسحها النشر):
#     BASECAMP_ACCOUNT_ID
#     BASECAMP_PROJECT_ID
#     BASECAMP_MESSAGE_BOARD_ID
#
#   اختياري (للكود قيم افتراضية إن لم تُضبط):
#     EXCHANGE_RATES    أسعار صرف العملات مقابل عملة الدفاتر، مفصولة بفواصل:
#                       "EUR:4.10,AED:1.021,GBP:4.75"
#                       الدولار غير محتاج إليه — الريال مربوط به عند 3.75.
#                       العملة التي لا سعر لها هنا يُسأل عنها المستخدم عند كل عملية.
#     CLAUDE_MODEL      (الافتراضي: claude-opus-4-8)
#     CLAUDE_API_BASE   (الافتراضي: https://api.anthropic.com/v1)
#     WAFEQ_API_BASE    (الافتراضي: https://api.wafeq.com/v1)
# ============================================================================
